<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#100d0b">
<title>AION · 六个 AI 与你一起投资</title>
<style>
  :root{
    --bg:#100d0b; --bg2:#17110d; --panel:#1a1511; --panel2:#241c15; --line:#3b2b1d;
    --text:#fff4e8; --muted:#b7a38d; --accent:#e9a34a; --accent2:#49b987;
    --blue:#d9a15f; --purple:#c88754; --red:#f06a62; --yellow:#ffc46b;
    --radius:16px; --shadow:0 6px 18px rgba(0,0,0,.18);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none !important}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    font-size:15px;line-height:1.5}
  body{padding-bottom:calc(80px + env(safe-area-inset-bottom))}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:radial-gradient(900px 500px at 15% -10%, rgba(233,163,74,.08), transparent 60%);}
  a{color:var(--accent);text-decoration:none}
  .shell{position:relative;z-index:1;display:flex;min-height:100vh}
  aside{display:none}
  .main{flex:1;min-width:0}
  header{position:sticky;top:0;z-index:20;background:rgba(7,9,12,.82);backdrop-filter:blur(16px);
    padding:14px 18px;border-bottom:1px solid rgba(34,48,68,.7);display:flex;align-items:center;gap:12px}
  header .logo{font-weight:750;letter-spacing:3px;font-size:16px;color:var(--accent);display:flex;align-items:center;gap:8px}
  header .logo img{width:28px;height:28px;object-fit:cover;border-radius:7px;border:1px solid rgba(233,163,74,.45)}
  header h1{font-size:15px;margin:0;font-weight:600;color:var(--muted);letter-spacing:.4px}
  header .right{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
  .pill{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);
    border-radius:999px;padding:5px 10px;font-size:12px;color:var(--muted)}
  .pill .dot{width:6px;height:6px;border-radius:50%;background:var(--accent)}
  .bell{position:relative;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);
    background:var(--panel2);color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer}
  .bell b{position:absolute;top:-3px;right:-3px;min-width:16px;height:16px;border-radius:9px;background:var(--red);
    color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;padding:0 4px}
  main{padding:18px 16px 10px;max-width:1080px;margin:0 auto}
  .card{background:var(--panel);
    border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px;}
  .card h2{font-size:12px;color:var(--muted);font-weight:600;margin:0 0 12px;letter-spacing:.12em;text-transform:uppercase}
  .card h3{font-size:15px;margin:0 0 8px;font-weight:600}
  .row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0}
  .row+.row{border-top:1px solid rgba(34,48,68,.55)}
  .label{color:var(--muted);font-size:13px}
  .val{font-variant-numeric:tabular-nums;font-weight:500;text-align:right}
  .big{font-size:32px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.4px}
  .up{color:var(--accent2)} .down{color:var(--red)} .warn{color:var(--yellow)} .muted{color:var(--muted)}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .chip{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:6px 11px;font-size:12px;color:var(--muted)}
  .chip b{color:var(--text);font-weight:600}
  .chip.ok{border-color:rgba(14,203,129,.45);color:var(--accent2)}
  .chip.bad{border-color:rgba(246,70,93,.45);color:var(--red)}
  input,select,button,textarea{font:inherit;color:var(--text)}
  input,select,textarea{width:100%;background:var(--panel2);border:1px solid var(--line);
    border-radius:12px;padding:11px 12px;outline:none;appearance:none}
  input:focus,select:focus,textarea:focus{border-color:var(--accent)}
  .field{margin-bottom:10px}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;width:100%;
    background:var(--accent);color:#201307;border:0;border-radius:12px;
    padding:13px 14px;font-weight:700;font-size:15px;cursor:pointer}
  .btn:active{opacity:.85}
  .btn.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
  .btn.danger{background:rgba(246,70,93,.12);color:var(--red);border:1px solid rgba(246,70,93,.4)}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
  .btn.small{width:auto;padding:8px 12px;font-size:13px;font-weight:600}
  .brand-pick.on{border-color:var(--accent);color:var(--accent);background:rgba(233,163,74,.08)}
  .mutedbox{color:var(--muted);font-size:13px;text-align:center;padding:20px 6px}
  .sep{height:1px;background:var(--line);margin:12px 0}
  .kv{display:grid;grid-template-columns:1fr auto;gap:7px 12px;font-size:13px}
  .kv .k{color:var(--muted)}
  .kv .v{text-align:right;font-variant-numeric:tabular-nums}
  .inline{display:flex;gap:8px;flex-wrap:wrap}
  .inline .btn{flex:1;min-width:120px}
  .list-item{padding:12px 0;border-bottom:1px solid rgba(34,48,68,.55)}
  .list-item:last-child{border-bottom:0}
  .li-top{display:flex;justify-content:space-between;gap:8px;font-size:14px;align-items:flex-start}
  .li-sub{color:var(--muted);font-size:12px;margin-top:4px;word-break:break-word}
  .status{font-size:11px;padding:2px 8px;border-radius:7px;background:var(--panel2);color:var(--muted);white-space:nowrap}
  .status.OK,.status.COMPLETED,.status.FILLED,.status.approved,.status.ACTIVE{color:var(--accent2);background:rgba(14,203,129,.12)}
  .status.ERROR,.status.REJECTED,.status.FAILED,.status.BLOCKED{color:var(--red);background:rgba(246,70,93,.12)}
  .status.RUNNING,.status.DEGRADED,.status.PENDING,.status.WAIT{color:var(--yellow);background:rgba(240,185,11,.12)}
  .status.VETO{color:var(--red);background:rgba(246,70,93,.14)}
  nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;overflow-x:auto;
    background:rgba(9,13,18,.96);backdrop-filter:blur(16px);border-top:1px solid var(--line);
    padding:6px 4px calc(6px + env(safe-area-inset-bottom));scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  nav button{flex:1 0 auto;min-width:54px;background:none;border:0;color:var(--muted);font-size:10.5px;padding:6px 4px;
    display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;white-space:nowrap}
  nav button.active{color:var(--accent)}
  nav .ico{font-size:17px;line-height:1}
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:22px;position:relative;z-index:1}
  .login{width:100%;max-width:400px}
  .brand{text-align:center;margin-bottom:24px}
  .brand img{display:block;width:116px;height:116px;object-fit:cover;border-radius:22px;margin:0 auto 14px;border:1px solid rgba(233,163,74,.5)}
  .brand .logo{font-size:36px;font-weight:800;letter-spacing:8px;
    background:linear-gradient(135deg,#fff,var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
  .brand .sub{color:var(--muted);font-size:11px;letter-spacing:2.5px;margin-top:6px}
  .tabs{display:flex;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:16px}
  .tabs button{flex:1;background:none;border:0;color:var(--muted);padding:9px;border-radius:9px;cursor:pointer;font-size:13px}
  .tabs button.active{background:var(--panel);color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.3)}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:100px;z-index:99;
    background:#1b2634;border:1px solid var(--line);color:var(--text);padding:11px 16px;
    border-radius:12px;font-size:13px;max-width:86vw;opacity:0;transition:opacity .2s;pointer-events:none;box-shadow:var(--shadow)}
  .toast.show{opacity:1}
  .spark{width:100%;height:60px;display:block;margin-top:6px}
  .msg{border-left:2px solid var(--line);padding:6px 0 6px 10px;margin-bottom:9px}
  .msg .who{font-size:12px;color:var(--accent);margin-bottom:2px}
  .msg .txt{font-size:13px;color:var(--text);white-space:pre-wrap;word-break:break-word}
  .msg .warn{font-size:12px;margin-top:4px}
  .spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.25);
    border-top-color:#04120f;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
  @keyframes sp{to{transform:rotate(360deg)}}
  /* hero */
  .hero{position:relative;overflow:hidden;border-radius:24px;padding:20px;margin-bottom:14px;
    background:linear-gradient(135deg,rgba(34,211,167,.16),rgba(74,158,255,.08) 55%,rgba(17,23,32,.96));
    border:1px solid rgba(34,211,167,.24);box-shadow:var(--shadow)}
  .hero .tag{font-size:11px;letter-spacing:.16em;color:var(--accent);text-transform:uppercase}
  .hero h2{font-size:24px;line-height:1.25;margin:8px 0 6px;color:var(--text);text-transform:none;letter-spacing:0}
  .hero p{margin:0;color:#b8c4d4;font-size:13px}
  .hero .actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
  .hero .actions .btn{width:auto;padding:10px 16px;font-size:13px}
  /* agent pipeline */
  .pipeline{display:flex;gap:10px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
  .pipeline::-webkit-scrollbar{display:none}
  .agent{position:relative;flex:0 0 158px;background:var(--panel2);border:1px solid var(--line);
    border-radius:15px;padding:12px;min-height:128px}
  .agent .idx{font-size:10px;color:var(--muted);letter-spacing:.12em}
  .agent .name{font-size:13px;font-weight:650;margin:5px 0 3px}
  .agent .purpose{font-size:11px;color:var(--muted);line-height:1.4;min-height:30px}
  .agent .meta{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:11px;color:var(--muted)}
  .agent.done{border-color:rgba(34,211,167,.4)}
  .agent.running{border-color:rgba(240,185,11,.5);box-shadow:0 0 0 1px rgba(240,185,11,.15) inset}
  .agent.veto{border-color:rgba(246,70,93,.55)}
  .agent .glow{position:absolute;inset:auto 12px 10px 12px;height:3px;border-radius:2px;background:var(--line)}
  .agent .glow i{display:block;height:100%;border-radius:2px;background:linear-gradient(90deg,var(--accent),var(--blue))}
  .six-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .six-cell{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center}
  .six-cell .num{font-size:10px;color:var(--muted)}
  .six-cell .nm{font-size:11px;margin-top:3px;color:var(--text)}
  .six-cell .st{font-size:10px;margin-top:4px;color:var(--muted)}
  .six-cell.on{border-color:rgba(34,211,167,.4)}
  .six-cell.off{opacity:.7}
  .decision-banner{border-radius:14px;padding:13px 14px;border:1px solid var(--line);
    background:rgba(74,158,255,.08);margin-bottom:12px;font-size:13px}
  .decision-banner.trade{border-color:rgba(14,203,129,.45);background:rgba(14,203,129,.08)}
  .decision-banner.wait{border-color:rgba(240,185,11,.35);background:rgba(240,185,11,.06)}
  .mode-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
  .mode-card{border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:11px 9px;cursor:pointer;text-align:center}
  .mode-card.active{border-color:var(--accent);background:rgba(34,211,167,.09)}
  .mode-card b{display:block;font-size:13px;margin-bottom:3px}
  .mode-card span{font-size:10.5px;color:var(--muted);line-height:1.35}
  .notice{font-size:12px;color:var(--muted);background:rgba(240,185,11,.06);border:1px solid rgba(240,185,11,.2);
    border-radius:12px;padding:10px 12px;margin-bottom:12px;line-height:1.5}
  .notice.danger{color:#ffb3bd;background:rgba(246,70,93,.08);border-color:rgba(246,70,93,.3)}
  .progress{height:5px;background:var(--panel2);border-radius:4px;overflow:hidden;margin:8px 0}
  .progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--blue))}
  @media(min-width:900px){
    body{padding-bottom:0}
    aside{display:flex;flex-direction:column;width:220px;flex:0 0 220px;border-right:1px solid var(--line);
      background:rgba(9,13,18,.7);backdrop-filter:blur(12px);padding:18px 12px;position:sticky;top:0;height:100vh}
    aside .brandmini{font-weight:800;letter-spacing:3px;font-size:18px;padding:6px 10px 18px;display:flex;align-items:center;gap:10px}
    aside .brandmini img{width:42px;height:42px;object-fit:cover;border-radius:10px;border:1px solid rgba(233,163,74,.45)}
    aside .brandmini small{display:block;font-size:9px;letter-spacing:2px;color:var(--muted);margin-top:3px;font-weight:400}
    aside nav{position:static;display:flex;flex-direction:column;background:none;border:0;padding:0;overflow:visible}
    aside nav button{width:100%;flex-direction:row;gap:10px;font-size:13px;padding:10px 12px;border-radius:10px;min-width:0}
    aside nav button.active{background:rgba(233,163,74,.1);color:var(--accent)}
    aside .foot{margin-top:auto;font-size:11px;color:var(--muted);padding:10px}
    main{padding:24px 28px 40px;max-width:1120px}
    .card{padding:18px}
    header{padding:16px 28px}
    nav{display:none}
  }
  @media(min-width:640px){ .big{font-size:38px} .hero h2{font-size:28px} }

  /* Console refinement v2.10 */
  :root{--bg:#0e0b09;--bg2:#17110c;--panel:#1c1510;--panel2:#281d13;--line:rgba(224,165,89,.22);--text:#fff5e9;--muted:#bba58b;--accent:#e8a34d;--accent2:#75c69a;--blue:#e2b36e;--purple:#c88754;--radius:17px;--shadow:0 12px 34px rgba(0,0,0,.22)}
  body::before{background:radial-gradient(900px 500px at 15% -10%,rgba(233,163,74,.10),transparent 60%),radial-gradient(700px 500px at 100% 30%,rgba(172,103,42,.06),transparent 60%)}
  header{background:rgba(14,11,9,.88);border-bottom-color:rgba(224,165,89,.18)}
  .card{box-shadow:0 8px 24px rgba(0,0,0,.12);transition:border-color .2s,transform .2s}
  .card:focus-within{border-color:rgba(232,163,77,.42)}
  .hero{background:linear-gradient(135deg,rgba(201,132,58,.16),rgba(128,77,33,.09) 55%,rgba(28,21,16,.98));border-color:rgba(224,165,89,.25)}
  .hero p{color:#c8b49b}.hero .tag{color:#f0bd75}
  .agent,.six-cell,.mode-card{border-color:rgba(224,165,89,.2)}
  .agent.done,.six-cell.on{border-color:rgba(117,198,154,.42)}
  nav{background:rgba(14,11,9,.97);border-top-color:rgba(224,165,89,.2)}
  aside{background:rgba(14,11,9,.82);border-right-color:rgba(224,165,89,.18)}
  aside nav button.active{background:rgba(232,163,77,.12)}
  .status.ACTIVE,.status.OK{color:#8ed5a8}
  .notice{background:rgba(232,163,77,.07);border-color:rgba(232,163,77,.22)}
  input,select,textarea{background:#21180f;border-color:rgba(224,165,89,.22)}
  input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(232,163,77,.08)}
  .btn{box-shadow:0 6px 16px rgba(185,112,39,.13)}
  .btn.secondary{background:#2a1e13;border-color:rgba(224,165,89,.22)}
  @media(min-width:900px){main{max-width:1240px;padding:28px 34px 48px}aside{width:236px;flex-basis:236px;padding:22px 14px}.card{padding:20px;border-radius:18px}}
  @media(max-width:639px){main{padding:14px 12px 12px}.card{padding:14px;border-radius:14px}.hero{border-radius:18px}.grid2{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>

<div id="login" class="login-wrap" hidden>
  <div class="login">
    <div class="brand">
      <img src="/ui/assets/aion-brand.webp" alt="AION 官方标识">
      <div class="logo">AION</div>
      <div class="sub">六个 AI · 一起为你投资</div>
    </div>
    <div class="card">
      <div class="tabs">
        <button id="tab-login" class="active" onclick="authTab('login')">管理员登录</button>

      <div class="field"><label>用户名</label><input id="l-user" autocomplete="username" placeholder="3-64 位字母、数字或 ._-"></div>

      <button class="btn" id="l-btn" onclick="authSubmit()">登录</button>

  </div>
</div>

<div id="app" class="shell" hidden>
  <aside>
    <div class="brandmini"><img src="/ui/assets/aion-brand.webp" alt="AION"><span>AION<small>INTELLIGENCE NETWORK</small></span></div>
    <nav id="nav-desktop"></nav>
    <div class="foot" id="side-foot"></div>

  <div class="main">
    <header>
      <span class="logo"><img src="/ui/assets/aion-brand.webp" alt="">AION</span>
      <h1 id="page-title">概览</h1>
      <div class="right">
        <span class="pill"><span class="dot"></span><span id="mode-badge">PAPER</span></span>

    <main>

      <section id="p-risk" class="page" hidden></section>
      <section id="p-strategies" class="page" hidden></section>
      <section id="p-ai" class="page" hidden></section>
      <section id="p-autopilot" class="page" hidden></section>
      <section id="p-learning" class="page" hidden></section>
      <section id="p-factors" class="page" hidden></section>

      <section id="p-users" class="page" hidden></section>

  </div>
  <nav id="nav"></nav>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";
const API = "/api/v1";
const S = {
  token: localStorage.getItem("aion_token") || "",
  refresh: localStorage.getItem("aion_refresh") || "",
  tab: "home",
  timer: null,
  market: { symbol: "BTCUSDT", interval: "15m", timer: null, snapshot: null },
  ai: { runId: null, timer: null, roster: null },
  overview: null,
  me: null,
  features: [],
  authMode: "login",
  apMode: "PAPER",
};

/* ---------- utils ---------- */
const $ = (id) => document.getElementById(id);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const n = (v, d = 2) => {
  if (v === null || v === undefined || v === "") return "—";
  const x = Number(v);
  if (!isFinite(x)) return esc(v);
  return x.toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
};
const money = (v, d = 2) => (v === null || v === undefined) ? "—" : "$" + n(v, d);
const pct = (v, d = 2) => (v === null || v === undefined) ? "—" : n(v, d) + "%";
const cls = (v) => Number(v) > 0 ? "up" : Number(v) < 0 ? "down" : "";
const dt = (v) => {
  if (!v) return "—";
  const d = new Date(v);
  if (isNaN(d)) return esc(v);
  const p = (x) => String(x).padStart(2, "0");
  return `${d.getMonth()+1}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
};
const ago = (v) => {
  if (!v) return "—";
  const s = Math.max(0, (Date.now() - new Date(v).getTime()) / 1000);
  if (s < 60) return `${Math.floor(s)} 秒前`;
  if (s < 3600) return `${Math.floor(s/60)} 分钟前`;
  if (s < 86400) return `${Math.floor(s/3600)} 小时前`;
  return `${Math.floor(s/86400)} 天前`;
};
function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2800);
}

/* ---------- api ---------- */
async function rawFetch(path, opts = {}) {
  const headers = Object.assign({ "Content-Type": "application/json" }, opts.headers || {});
  if (S.token) headers.Authorization = "Bearer " + S.token;
  const res = await fetch(API + path, { ...opts, headers });
  let data = null;
  const text = await res.text();
  if (text) { try { data = JSON.parse(text); } catch { data = { raw: text }; } }
  return { res, data };
}
async function refreshToken() {
  if (!S.refresh) return false;
  try {
    const { res, data } = await rawFetch("/auth/refresh", {
      method: "POST", body: JSON.stringify({ refresh_token: S.refresh })
    });
    if (!res.ok || !data?.access_token) return false;
    setTokens(data); return true;
  } catch { return false; }
}
function setTokens(d) {
  S.token = d.access_token || ""; S.refresh = d.refresh_token || S.refresh;
  localStorage.setItem("aion_token", S.token);
  if (S.refresh) localStorage.setItem("aion_refresh", S.refresh);
}
async function api(path, opts = {}) {
  let r = await rawFetch(path, opts);
  if (r.res.status === 401 && S.refresh) {
    if (await refreshToken()) r = await rawFetch(path, opts);
  }
  if (r.res.status === 401) { showLogin(); throw new Error("登录已失效"); }
  if (!r.res.ok) {
    const e = r.data?.error;
    throw new Error(e?.message || (e?.code ? e.code : `HTTP ${r.res.status}`));
  }
  return r.data;
}
function toggleTotp(e) {
  e.preventDefault();
  const w = $("l-totp-wrap");
  w.hidden = !w.hidden;
  if (!w.hidden) $("l-totp").focus();
}
function authTab(mode) {

  $("tab-login").classList.toggle("active", mode === "login");
  $("tab-register").classList.toggle("active", mode === "register");
  $("l-btn").textContent = mode === "login" ? "登录" : "创建账号";
  $("l-pass").setAttribute("autocomplete", mode === "login" ? "current-password" : "new-password");

async function authSubmit() {
  const btn = $("l-btn");
  const body = { username: $("l-user").value.trim(), password: $("l-pass").value, device_name: "AION Web" };
  if (!body.username || !body.password) return toast("请输入用户名和密码");
  if (S.authMode === "login") {
    const t = $("l-totp").value.trim();
    if (t) body.totp_code = t;
  }
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span> 请稍候';
  try {
    const { res, data } = await rawFetch("/auth/" + (S.authMode === "login" ? "login" : "register"), {
      method: "POST", body: JSON.stringify(body)
    });
    if (!res.ok) {
      if (res.status === 429) throw new Error("尝试次数过多，请稍后再试");
      if (res.status === 401) throw new Error("用户名、密码或验证码不正确");
      throw new Error(data?.error?.message || `请求失败 (HTTP ${res.status})`);
    }
    setTokens(data);
    showApp();
    await loadIdentity();
    switchTab("home");
    if (S.authMode === "register") toast("注册成功，模拟账户已开通");
  } catch (e) {
    toast(e.message || "请求失败");
  } finally {
    btn.disabled = false; btn.textContent = S.authMode === "login" ? "登录" : "创建账号";
  }
}

function renderPipeline(roster, detail) {
  const box = $("ag-pipeline");
  if (!box) return;
  const msgs = detail?.messages || [];
  const byName = Object.fromEntries(msgs.map(m => [m.agent_name, m]));
  box.innerHTML = roster.map((a, i) => {
    const m = byName[a.name];
    const status = m?.status || (detail ? "WAIT" : "待命");
    const done = m && m.status === "OK";
    const veto = a.veto && m && (m.status !== "OK" || (m.warnings || []).length);
    const conf = m?.confidence !== null && m?.confidence !== undefined ? Math.round(Number(m.confidence) * 100) + "%" : "";
    const pctDone = done ? 100 : status === "RUNNING" ? 55 : 0;
    return `<div class="agent ${done ? "done" : ""} ${status === "RUNNING" ? "running" : ""} ${veto ? "veto" : ""}">
      <div class="idx">STEP 0${i+1} · ${esc(a.stage)}</div>
      <div class="name">${esc(a.title)}</div>
      <div class="purpose">${esc(a.purpose)}</div>
      <div class="meta"><span>${m?.latency_ms ? m.latency_ms + "ms" : status}</span><span>${conf}</span></div>
      <div class="glow"><i style="width:${pctDone}%"></i></div>
    </div>`;
  }).join("");
}
function renderRunDetail(r) {
  const roster = S.ai.roster || [];
  const order = Object.fromEntries(roster.map((a, i) => [a.name, i + 1]));
  const msgs = (r.messages || []).slice().sort((a, b) => (order[a.agent_name] || a.seq) - (order[b.agent_name] || b.seq));
  const title = Object.fromEntries(roster.map(a => [a.name, a.title]));
  return `
    <div class="row"><span class="label">${esc(r.symbol)} · ${esc(r.interval)} · ${esc(r.mode)}</span>
      <span class="status ${esc(r.status)}">${esc(r.status)}</span></div>
    <div class="row"><span class="label">合议结论</span>
      <span class="val ${r.verdict === "TRADE" ? "up" : "warn"}">${esc(r.verdict || "—")}</span></div>
    <div class="row"><span class="label">置信度</span><span class="val">${r.confidence ?? "—"}</span></div>
    <div class="row"><span class="label">耗时 / 成本</span>
      <span class="val">${r.duration_ms ? (r.duration_ms / 1000).toFixed(1) + "s" : "—"} · $${n(r.total_cost_usd, 4)}</span></div>

async function refreshMarketPrice() {
  const snap = S.market.snapshot;
  if (!snap) return;
  try {
    const data = await api("/market/live");
    const item = (data.items || []).find(x => x.symbol === S.market.symbol);
    if (!item) return;
    const last = $("m-last");
    const chg = $("m-chg");
    const ts = $("m-ts");
    if (last) last.textContent = n(item.price, 2);
    if (chg) chg.textContent = `${pct(item.change_pct_24h)} · 24h`;
    if (ts) ts.textContent = ago(item.captured_at);
    const badge = $("m-live");
    if (badge) badge.textContent = item.age_ms != null && item.age_ms < 5000 ? "实时" : "延迟";
  } catch (e) {
    /* transient network error: keep the last rendered price */
  }
}
function drawSpark(svg, candles) {
  if (!svg) return;
  if (!candles.length) { svg.innerHTML = ""; return; }
  const xs = candles.map(c => Number(c.close));
  const min = Math.min(...xs), max = Math.max(...xs), span = (max - min) || 1;
  const pts = xs.map((v, i) => `${(i / (xs.length - 1 || 1)) * 300},${52 - ((v - min) / span) * 48}`).join(" ");
  const color = xs[xs.length - 1] >= xs[0] ? "#0ecb81" : "#f6465d";
  svg.innerHTML = `<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.6" vector-effect="non-scaling-stroke"/>`;
}

function drawEquity(svg, values) {
  if (!svg || !values.length) return;
  const min = Math.min(...values), max = Math.max(...values), span = (max - min) || 1;
  const pts = values.map((v, i) => `${(i / (values.length - 1 || 1)) * 300},${52 - ((v - min) / span) * 48}`).join(" ");
  const color = values[values.length - 1] >= values[0] ? "#0ecb81" : "#f6465d";
  const zero = values.some(v => v < 0) && values.some(v => v > 0)
    ? `<line x1="0" x2="300" y1="${52 - ((0 - min) / span) * 48}" y2="${52 - ((0 - min) / span) * 48}" stroke="#2b3542" stroke-width="0.6" stroke-dasharray="3 3"/>`
    : "";
  svg.innerHTML = `${zero}<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.6" vector-effect="non-scaling-stroke"/>`;
}

let faLibTimer = null;

    try {

          ${f.hypothesis ? `<div class="li-sub" style="color:var(--text);margin-top:4px">${esc(f.hypothesis)}</div>` : ""}
        </div>`).join("") : '<div class="mutedbox">因子库为空。发起一次研究，通过评估的因子会收录在这里。</div>';

        ${providers.map(p => `
          <div class="list-item">
            <div class="li-top"><b style="display:flex;align-items:center;gap:8px"><img src="/site/assets/characters/${(MODEL_BRANDS.find(b => b.kind === p.kind) || {}).img || "chatgpt"}.png" alt="" style="width:24px;height:24px;border-radius:50%;object-fit:cover">${esc(p.name)}</b>
              <span class="status ${p.is_enabled ? "OK" : "REJECTED"}">${esc(p.kind)} · ${p.is_enabled ? "启用" : "禁用"}</span></div>
            <div class="li-sub">Key ${esc(p.api_key_masked || "未保存")} · 轻量 ${esc(p.light_model)} · 主力 ${esc(p.heavy_model)}</div>
            <div class="li-sub">${esc(p.base_url || "默认地址")}</div>
            <div class="inline" style="margin-top:8px">
              <button class="btn small secondary" onclick="toggleProvider('${p.id}', ${!p.is_enabled})">${p.is_enabled ? "禁用" : "启用"}</button>
              <button class="btn small danger" onclick="deleteProvider('${p.id}')">删除</button>
            </div>
          </div>`).join("") || '<div class="mutedbox">还没有 Provider</div>'}
      </div>
      <div class="card"><h2>分配给用户</h2>
        ${users.length ? `
        <div class="field"><label>用户</label><select id="am-user" onchange="fillAssign(this.value)">
          ${users.map(u => `<option value="${u.user_id}">${esc(u.username)}${u.configured ? " · 已配置" : ""}</option>`).join("")}
        </select></div>
        <div class="field"><label>Provider</label><select id="am-provider"><option value="">— 不分配 —</option>${providerOpts}</select></div>
        <div class="grid2">
          <div class="field"><label>轻量模型（可留空）</label><input id="am-light"></div>
          <div class="field"><label>主力模型（可留空）</label><input id="am-heavy"></div>
        </div>
        <div class="grid2">
          <div class="field"><label>每日预算 (USD)</label><input id="am-budget" inputmode="decimal" value="5"></div>
          <div class="field"><label>启用</label><select id="am-enabled"><option value="1">是</option><option value="0">否</option></select></div>
        </div>
        <div class="sep"></div>
        <h3 style="font-size:14px;margin-bottom:6px">六个 AI 分工与模型</h3>
        <div class="li-sub" style="margin-bottom:10px">每个 AI 承担固定职责；留空表示使用上面的轻量/主力模型。可给单个 AI 指定更快或更强的模型。</div>
        ${(roster || []).map(a => `
          <div class="field">
            <label>${a.order}. ${esc(a.title)} · ${esc(a.stage)}${a.veto ? " · 一票否决" : ""}</label>
            <div class="li-sub" style="margin-bottom:6px">${esc(a.purpose)}</div>
            <input id="am-role-${a.name}" placeholder="留空=默认模型" autocomplete="off">
          </div>`).join("")}
        <button class="btn" onclick="saveAssignment()">保存分配</button>
        <div class="li-sub" style="margin-top:8px">未分配用户的请求会回退到服务器上第一个启用的 Provider（公开部署可用）。</div>`
        : '<div class="mutedbox">暂无用户</div>'}
      </div>`;
    if (users.length) fillAssign(users[0].user_id);
  } catch (e) {
    el.innerHTML = `<div class="card"><div class="mutedbox">加载失败：${esc(e.message)}</div></div>`;
  }
}
function fillAssign(userId) {
  const it = (S.models?.assignments || []).find(x => x.user_id === userId) || {};
  $("am-provider").value = it.provider_id || "";
  $("am-light").value = it.light_model || "";
  $("am-heavy").value = it.heavy_model || "";
  $("am-budget").value = it.daily_budget_usd ?? "5";
  $("am-enabled").value = it.enabled ? "1" : "0";
  (S.models?.roster || []).forEach(a => {
    const input = $("am-role-" + a.name);
    if (input) input.value = (it.role_models || {})[a.name] || "";
  });
}
async function createProvider() {
  const body = {
    name: $("mp-name").value.trim(), kind: $("mp-kind").value,
    base_url: $("mp-url").value.trim() || null, api_key: $("mp-key").value.trim(),
    light_model: $("mp-light").value.trim(), heavy_model: $("mp-heavy").value.trim(),
  };
  try { await api("/models/providers", { method: "POST", body: JSON.stringify(body) }); toast("Provider 已保存"); loadModels(); }
  catch (e) { toast(e.message); }
}
async function toggleProvider(id, enabled) {
  try { await api("/models/providers/" + id, { method: "PATCH", body: JSON.stringify({ is_enabled: enabled }) }); toast(enabled ? "已启用" : "已禁用"); loadModels(); }
  catch (e) { toast(e.message); }
}
async function deleteProvider(id) {
  if (!confirm("删除该 Provider？已分配的用户会失去访问。")) return;
  try { await api("/models/providers/" + id, { method: "DELETE" }); toast("已删除"); loadModels(); }
  catch (e) { toast(e.message); }
}
async function saveAssignment() {
  const userId = $("am-user").value;
  if (!userId) return toast("请选择用户");
  const roleModels = {};
  (S.models?.roster || []).forEach(a => {
    const input = $("am-role-" + a.name);
    const value = input ? input.value.trim() : "";
    if (value) roleModels[a.name] = value;
  });
  const body = {
    provider_id: $("am-provider").value || null,
    light_model: $("am-light").value.trim() || null,
    heavy_model: $("am-heavy").value.trim() || null,
    role_models: roleModels,
    daily_budget_usd: Number($("am-budget").value || 0),
    enabled: $("am-enabled").value === "1",
  };
  try { await api("/models/assignments/" + userId, { method: "PUT", body: JSON.stringify(body) }); toast("分配已保存"); loadModels(); }
  catch (e) { toast(e.message); }
}

/* ---------- boot ---------- */
$("l-pass").addEventListener("keydown", (e) => { if (e.key === "Enter") authSubmit(); });
(async function boot() {
  if (!S.token) return showLogin();
  showApp();
  try { await loadIdentity(); switchTab("home"); }
  catch { showLogin(); }
})();
</script>
</body>
</html>
